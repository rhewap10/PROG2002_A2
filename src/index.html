<!doctype html>


<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inventory (TypeScript)</title>
    <link rel="stylesheet" href="styles.css">
</head>



<body>
    <nav class="topnav" role="navigation" aria-label="Main navigation">
        <div class="nav-inner">
            <div class="brand">Inventory</div>
            <div class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Help</a>
            </div>
        </div>
    </nav>



    <div class="container">
        <h1>Inventory System</h1>

        <div id="message" aria-live="polite"></div>

        <form id="form">
            <div class="row">
                <label>Name <input id="name" required></label>
                <label>Category <input id="category" required></label>
            </div>
            <div class="row">
                <label>Quantity <input id="quantity" type="number" value="0"></label>
                <label>Price <input id="price" type="number" step="0.01" value="0"></label>
            </div>
            <div class="row">
                <label>Supplier <input id="supplier"></label>
                <label>Stock Status <input id="stockStatus"></label>
            </div>
            <div class="row">
                <label>Popular <input id="isPopular" type="checkbox"></label>
                <label>Comment <input id="comment"></label>
            </div>
            <div class="row">
                <button id="submit" type="submit">Add Item</button>
                <button id="showAll" type="button">Show All</button>
                <button id="showPopular" type="button">Show Popular</button>
            </div>
        </form>



        <div class="search">
            <input id="q" placeholder="Search by name...">
        </div>

        <h2>Items</h2>
        <div id="list"></div>
    </div>


    <script type="module" src="js/app.js"></script>
</body>

</html>
